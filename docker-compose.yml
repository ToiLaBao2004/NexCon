version: "3.9"

# NexCon – Docker Compose
# Cấu trúc: backend (Node/Express/Socket.io) + frontend (Nginx)
# Database: MongoDB Atlas (external – không cần container)
#

services:

  # REDIS
  redis:
    image: redis:7-alpine
    container_name: nexcon_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - nexcon_net

  # LIVEKIT
  livekit:
    image: livekit/livekit-server:latest
    container_name: nexcon_livekit
    command: --dev --bind 0.0.0.0
    restart: unless-stopped
    ports:
      - "7880:7880"       # HTTP API + WebSocket
      - "7881:7881"       # RTC over TCP
      - "7882:7882/udp"   # RTC over UDP
    networks:
      - nexcon_net

  # BACKEND
  server:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexcon_server
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      # Server
      PORT: 5001

      # MongoDB Atlas (external)
      MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING}

      # JWT
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}

      # Google OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      # URLs
      BACKEND_URL: ${BACKEND_URL:-http://localhost:5001}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}

      # Email
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}

      # LiveKit
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}

      # Cloudinary
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}

      # Redis / BullMQ
      REDIS_URL: redis://redis:6379
      ENABLE_INLINE_GROUP_CLEANUP_WORKER: "false"

    depends_on:
      redis:
        condition: service_started

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/auth/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - nexcon_net

  # BACKGROUND WORKER
  group-cleanup-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexcon_group_cleanup_worker
    restart: unless-stopped
    command: npm run worker:group-cleanup
    environment:
      MONGODB_CONNECTION_STRING: ${MONGODB_CONNECTION_STRING}
      REDIS_URL: redis://redis:6379
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    depends_on:
      redis:
        condition: service_started
    networks:
      - nexcon_net

  # FRONTEND 
  client:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Vite nhúng env vào JS tại BUILD TIME nên phải truyền qua build args
        VITE_NATIVE_API_URL: ${VITE_NATIVE_API_URL:-http://localhost:5001/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:5001/}
        VITE_LIVEKIT_URL: ${VITE_LIVEKIT_URL:-ws://localhost:7880}
    container_name: nexcon_client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      server:
        condition: service_started
    networks:
      - nexcon_net

# NETWORKS
networks:
  nexcon_net:
    driver: bridge
